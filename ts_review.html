<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T+S Review · 9.24</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #FAFAF8; color: #1A1A1A; min-height: 100vh; }
  :root {
    --wine: #8D1B3D; --wine-light: #FCEBEB;
    --olive: #75815C; --olive-light: #EAF3DE;
    --khaki-light: #F5EFE6;
    --purple: #9BA2FF;
    --amber: #FAC775; --amber-dark: #633806;
    --green: #0F6E56; --green-light: #E1F5EE;
    --text: #1A1A1A; --text-sec: #666; --text-ter: #999;
    --border: #E8E2D9; --card: #fff;
  }
  .signals-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .signal-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 6px; background: #FAFAF8; }
  .signal-row.signal-scored { background: var(--wine-light); }
  .signal-row.signal-unscored { background: #F5F5F3; opacity: 0.7; }
  .signal-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .dot-triggered { background: var(--wine); }
  .dot-unscored { background: var(--text-ter); }
  .signal-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .signal-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .signal-observed { font-size: 12px; color: var(--text-sec); }
  .signal-contrib { font-size: 12px; font-weight: 600; color: var(--wine); flex-shrink: 0; padding-top: 2px; }
  .signal-contrib-zero { font-size: 11px; color: var(--text-ter); flex-shrink: 0; padding-top: 3px; font-style: italic; }
  .signal-row-header { font-size: 11px; font-weight: 600; color: var(--text-ter); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; padding: 0 2px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-brand { color: #fff; font-weight: 600; font-size: 16px; }
  .header-sub { color: rgba(255,255,255,0.6); font-size: 14px; }
  .header-tabs { display: flex; gap: 4px; }
  .tab-btn { padding: 5px 12px; border-radius: 6px; border: none; background: transparent; color: #fff; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: rgba(255,255,255,0.2); font-weight: 600; }
  .main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .summary-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
  .summary-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .summary-num { font-size: 22px; font-weight: 500; }
  .summary-label { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 0.5px solid var(--border); background: transparent; color: var(--text-sec); cursor: pointer; }
  .filter-btn.active { border-color: var(--wine); background: var(--wine-light); color: var(--wine); }
  .run-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .run-meta { font-size: 12px; color: var(--text-sec); }
  .case-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .case-card.cross-host { border-color: var(--amber); }
  .case-header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .case-header:hover, .case-header.open { background: var(--khaki-light); }
  .score-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; flex-shrink: 0; }
  .case-meta { flex: 1; min-width: 0; }
  .case-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .case-name { font-weight: 500; font-size: 15px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .case-name:hover { color: var(--wine); }
  .case-stats { font-size: 12px; color: var(--text-sec); display: flex; gap: 6px; flex-wrap: wrap; }
  .case-summary { font-size: 13px; color: var(--text-sec); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chevron { font-size: 16px; color: var(--text-sec); transition: transform 0.2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .case-body { padding: 0 16px 16px; border-top: 0.5px solid var(--border); }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-ter); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
  .bullets { margin: 10px 0 0; padding-left: 16px; }
  .bullets li { font-size: 13px; color: var(--text); margin-bottom: 5px; line-height: 1.5; }
  .signals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .signal-pill { padding: 4px 10px; border-radius: 6px; font-size: 12px; }
  .signal-pill.triggered { background: var(--wine-light); color: var(--wine); }
  .signal-pill.not-triggered { background: #F0F0EE; color: var(--text-ter); }
  .breakdown-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .breakdown-row.dimmed { opacity: 0.4; }
  .breakdown-contrib { color: var(--wine); font-weight: 500; }
  .breakdown-total { display: flex; justify-content: space-between; padding: 6px 0 2px; font-weight: 600; font-size: 14px; }
  .collapsible { border: 0.5px solid var(--border); border-radius: 8px; margin-top: 12px; overflow: hidden; }
  .collapsible-header { padding: 10px 12px; display: flex; justify-content: space-between; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); }
  .collapsible-header:hover { background: var(--khaki-light); }
  .collapsible-body { padding: 10px 12px; border-top: 0.5px solid var(--border); display: none; }
  .collapsible-body.open { display: block; }
  .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .profile-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .profile-label { color: var(--text-sec); }
  .profile-val { font-weight: 500; color: var(--text); text-align: right; }
  .cluster-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .cluster-table th { text-align: left; font-weight: 500; color: var(--text-sec); padding: 6px 8px; border-bottom: 0.5px solid var(--border); font-size: 12px; }
  .cluster-table td { padding: 8px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
  .cluster-ctx-table td { padding: 5px 8px; border-bottom: 0.5px solid var(--border); font-size: 12px; vertical-align: top; }
  .cluster-banner { background: #FAEEDA; border-left: 3px solid #BA7517; padding: 8px 12px; font-size: 13px; color: var(--amber-dark); border-radius: 0 6px 6px 0; margin: 12px 0 4px; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .badge.suspension { background: var(--wine-light); color: var(--wine); }
  .badge.nourishment_pause { background: #FAEEDA; color: var(--amber-dark); }
  .badge.warning { background: var(--olive-light); color: #27500A; }
  .badge.dismiss { background: #F0F0EE; color: var(--text-sec); }
  .badge.program_team { background: var(--green-light); color: var(--green); }
  .badge.actioned { background: var(--olive-light); color: var(--green); font-size: 11px; padding: 2px 8px; }
  .badge.flag-confirm { background: var(--amber); color: var(--amber-dark); }
  .badge.flag-program { background: var(--green-light); color: var(--green); }
  .action-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; }
  .action-box.ts { background: var(--wine-light); }
  .action-box.dismiss-box { background: #F0F0EE; }
  .action-box.program { background: var(--green-light); }
  .action-title { font-weight: 500; font-size: 13px; margin-bottom: 6px; }
  .action-host { font-weight: 500; font-size: 12px; color: var(--text); margin-bottom: 2px; margin-top: 8px; }
  .action-item { font-size: 12px; padding-left: 12px; margin-bottom: 2px; }
  .action-item.ready { color: var(--green); }
  .action-item.pending { color: #854F0B; }
  .notes-textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 0.5px solid var(--border); font-size: 13px; min-height: 72px; resize: vertical; font-family: inherit; color: var(--text); background: var(--card); }
  .notes-textarea:focus { outline: none; border-color: var(--wine); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .footer-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 6px 16px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; font-weight: 500; }
  .btn-primary { background: var(--wine); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--text-sec); cursor: default; }
  .btn-secondary { background: transparent; border: 0.5px solid var(--border); color: var(--text-sec); }
  .btn-discuss { padding: 6px 14px; border-radius: 6px; border: 0.5px solid var(--border); background: transparent; font-size: 13px; cursor: pointer; color: var(--text-sec); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-amber { background: var(--amber); color: var(--amber-dark); }
  .override-panel { margin-top: 12px; padding: 12px; background: var(--khaki-light); border-radius: 8px; border: 0.5px solid var(--border); }
  .override-panel select, .override-panel textarea { width: 100%; padding: 6px 10px; border-radius: 6px; border: 0.5px solid var(--border); font-size: 13px; margin-bottom: 8px; font-family: inherit; }
  .override-panel label { font-size: 13px; color: var(--text-sec); margin-bottom: 6px; display: block; }
  .cluster-warning { margin-top: 12px; padding: 10px 12px; background: #FAEEDA; border-radius: 8px; font-size: 13px; color: var(--amber-dark); }
  .flag-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .flag-icon.program { background: var(--green-light); color: var(--green); }
  .flag-icon.confirm { background: #FAEEDA; color: var(--amber-dark); }
  .flag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .flag-chip { padding: 4px 10px; border-radius: 6px; font-size: 12px; }
  .flag-chip.yes { background: var(--green-light); color: var(--green); }
  .flag-chip.no { background: var(--wine-light); color: var(--wine); }
  .flag-chip.neutral { background: #F0F0EE; color: var(--text-sec); }
  .flag-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .flag-table th { text-align: left; font-weight: 500; color: var(--text-sec); padding: 6px 8px; border-bottom: 0.5px solid var(--border); font-size: 12px; }
  .flag-table td { padding: 8px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
  .insights-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  .insights-table th { text-align: left; padding: 6px 8px; border-bottom: 0.5px solid var(--border); font-weight: 500; color: var(--text-sec); font-size: 12px; }
  .insights-table td { padding: 6px 8px; }
  .slack-box { margin-top: 16px; padding: 16px; background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; }
  .slack-locked { padding: 16px; background: var(--khaki-light); border-radius: 8px; text-align: center; font-size: 13px; color: var(--text-sec); margin-top: 16px; }
  .slack-draft { width: 100%; min-height: 140px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid var(--border); font-size: 13px; font-family: monospace; resize: vertical; margin-bottom: 10px; }
  .load-panel { max-width: 600px; margin: 48px auto; padding: 0 16px; text-align: center; }
  .load-icon { font-size: 32px; margin-bottom: 12px; }
  .load-title { font-weight: 600; font-size: 18px; margin-bottom: 8px; }
  .load-sub { font-size: 14px; color: var(--text-sec); margin-bottom: 24px; }
  .load-status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .load-status.error { background: var(--wine-light); color: var(--wine); }
  .chat-panel { position: fixed; bottom: 0; right: 0; width: 400px; height: 60vh; background: var(--card); border: 1px solid var(--border); border-radius: 12px 12px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; z-index: 1000; }
  .chat-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--wine); border-radius: 12px 12px 0 0; }
  .chat-header-name { font-weight: 600; font-size: 14px; color: #fff; }
  .chat-header-sub { font-size: 12px; color: rgba(255,255,255,0.7); }
  .chat-close { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { display: flex; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
  .chat-bubble.user { background: var(--wine); color: #fff; border-radius: 12px 12px 2px 12px; }
  .chat-bubble.assistant { background: var(--khaki-light); color: var(--text); border-radius: 12px 12px 12px 2px; }
  .chat-quick { padding: 6px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 0.5px solid var(--border); }
  .chat-quick-btn { font-size: 11px; padding: 3px 8px; border-radius: 10px; border: 0.5px solid var(--border); background: transparent; cursor: pointer; color: var(--text-sec); }
  .chat-quick-btn:hover { background: var(--khaki-light); }
  .chat-input-row { padding: 8px 12px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; }
  .chat-input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 0.5px solid var(--border); font-size: 13px; outline: none; font-family: inherit; }
  .chat-input:focus { border-color: var(--wine); }
  .chat-send { padding: 8px 14px; border-radius: 8px; border: none; background: var(--wine); color: #fff; font-size: 13px; cursor: pointer; }
  .chat-send:disabled { background: var(--border); cursor: default; }
  .history-item { padding: 12px 16px; background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .history-item:hover { background: var(--khaki-light); }
  .empty { text-align: center; padding: 64px 24px; color: var(--text-sec); }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }
  a { color: inherit; }
  .purple-link { color: var(--purple); text-decoration: none; }
  .purple-link:hover { text-decoration: underline; }
  .section-divider { font-size: 11px; font-weight: 500; color: var(--text-ter); text-transform: uppercase; letter-spacing: 0.05em; margin: 24px 0 10px; }
  .prior-action-note { background: var(--khaki-light); border-left: 3px solid var(--khaki); padding: 8px 12px; font-size: 13px; color: var(--text-sec); border-radius: 0 6px 6px 0; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── state ──────────────────────────────────────────────────────────────────
const state = {
  view: 'load',
  runs: [],
  current: null,
  filter: 'all',
  actionState: {},
  activeChat: null,
  overrideOpen: null,
  hostOverrideOpen: null,
  clusterWarning: null,
  openCards: new Set(),
  warningsExpanded: false,
  highNourWarningsExpanded: false,
};

// ── storage ────────────────────────────────────────────────────────────────
const STORE_KEY = 'ts-weekly-runs';
function loadRuns() { try { return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch { return []; } }
function saveRuns(r) { try { localStorage.setItem(STORE_KEY, JSON.stringify(r)); } catch {} }

// State initialised after loadRuns -- safe even if localStorage throws
state.runs = loadRuns();

// ── helpers ────────────────────────────────────────────────────────────────
const TIER_LABELS = { suspension:'Suspension (Soft)', nourishment_pause:'Warning (DNN)', warning_dnn:'Warning (DNN)', warning:'Warning', dismiss:'Dismissed · No misuse', program_team:'Referred to program team' };
const TIER_COLORS = { suspension:'var(--wine)', nourishment_pause:'var(--amber-dark)', warning_dnn:'var(--amber-dark)', warning:'var(--olive)' };
const TIER_BGS = { suspension:'var(--wine-light)', nourishment_pause:'#FAEEDA', warning_dnn:'#FAEEDA', warning:'var(--olive-light)' };

function tierLabel(t, score) {
  if (t === 'suspension') return (score >= 25) ? 'Suspension (Strict)' : 'Suspension (Soft)';
  return TIER_LABELS[t] || t;
}
function tierClass(t) { return t || 'warning'; }
function scoreColor(t) { return TIER_COLORS[t] || 'var(--text-sec)'; }
function scoreBg(t) { return TIER_BGS[t] || '#F0F0EE'; }
function caseEmail(c) {
  if (c.email) return c.email;
  if (c.is_cluster && c.cluster_hosts?.length)
    return c.cluster_hosts.map(h => h.email).filter(e => e && e.trim()).join(', ');
  return '';
}
function md(s) {
  return (s||'')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--purple);text-decoration:underline">$1 ↗</a>')
    .replace(/\n/g,'<br>');
}
function copyLink(url, label) {
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = orig, 1500);
  });
  event.stopPropagation();
}
function sfCampaignUrl(c) {
  if (c.campaign_id) return `https://onetable.lightning.force.com/lightning/r/Campaign/${c.campaign_id}/view`;
  return '';
}
function runDate() { return state.current?.run?.run_date || state.current?.run?.week_of || ''; }
function esc(s) { return (s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }

// ── file load ──────────────────────────────────────────────────────────────
// Auto-load from same folder disabled -- paste JSON into the load screen instead
async function tryLoadFromFile() { return null; }

// ── render ─────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = buildApp();
  const cm = document.getElementById('chat-messages');
  if (cm) cm.scrollTop = cm.scrollHeight;
}

function buildApp() {
  return `
    ${buildHeader()}
    <div class="main">
      ${state.view==='load' ? buildLoadView() : ''}
      ${state.view==='review' ? buildReviewView() : ''}
      ${state.view==='history' ? buildHistoryView() : ''}
    </div>
    ${state.activeChat ? buildChatPanel() : ''}`;
}

// ── header ─────────────────────────────────────────────────────────────────
function buildHeader() {
  return `<div class="header">
    <div class="header-left"><span class="header-brand">T+S Review</span><span class="header-sub">9.24</span></div>
    <div class="header-tabs">
      ${['load','review','history'].map(v=>`<button class="tab-btn ${state.view===v?'active':''}" onclick="switchView('${v}')">${v==='load'?'Load Run':v==='review'?'Current Run':'History'}</button>`).join('')}
    </div>
  </div>`;
}

// ── load view ─────────────────────────────────────────────────────────────
function buildLoadView() {
  return `<div class="load-panel">
    <div class="load-icon">📋</div>
    <div class="load-title">Load Weekly Run</div>
    <div class="load-sub">Auto-loads <code>ts_ui_data.json</code> from the same folder, or paste the JSON below.</div>
    <button class="btn btn-primary" onclick="autoLoad()" style="margin-bottom:16px;">↻ Refresh from file</button>
    <div id="load-status"></div>
    <textarea id="paste-input" placeholder="Or paste ts_ui_data JSON here..." style="width:100%;min-height:120px;padding:10px;border-radius:8px;border:0.5px solid var(--border);font-size:13px;font-family:monospace;resize:vertical;margin-bottom:10px;"></textarea>
    <button class="btn btn-primary" onclick="loadFromPaste()" style="width:100%;">Load from paste</button>
    ${state.runs.length>0?`<div style="margin-top:16px;font-size:13px;color:var(--text-sec);">Or <a href="#" onclick="switchView('history');return false;" style="color:var(--wine);">view a previous run</a>.</div>`:''}
  </div>`;
}

// ── review view ───────────────────────────────────────────────────────────
function buildReviewView() {
  if (!state.current) return `<div class="empty"><div class="empty-icon">📭</div><div style="font-size:16px;margin-bottom:8px;">No run loaded</div><button class="btn btn-primary" onclick="switchView('load')">Load a run</button></div>`;

  const cases = (state.current.cases||[]).filter(c => ['warning','warning_dnn','nourishment_pause','suspension','deactivation'].includes(c.tier));
  const priorAction = (state.current.cases||[]).filter(c => !['warning','warning_dnn','nourishment_pause','suspension','deactivation'].includes(c.tier));
  const flags = state.current.cross_host_flags || [];
  const allActioned = cases.length>0 && cases.every(c=>state.actionState[c.id]) && flags.every(f=>state.actionState[f.id]);

  const filtered = cases.filter(c=>{
    if (state.filter==='all') return true;
    if (state.filter==='cluster') return c.is_cluster;
    return c.tier===state.filter;
  }).sort((a,b)=>{
    // Clusters first
    if (a.is_cluster&&!b.is_cluster) return -1;
    if (!a.is_cluster&&b.is_cluster) return 1;
    // Then by tier severity
    const tierOrder = {suspension:0, deactivation:0, nourishment_pause:1, warning_dnn:1, warning:2};
    const tA = tierOrder[a.tier]??3;
    const tB = tierOrder[b.tier]??3;
    if (tA!==tB) return tA-tB;
    // Within tier, by score descending
    return b.score-a.score;
  });

  // Derive counts from actual cases, not the summary object which may be stale
  const validCases = (state.current.cases||[]).filter(c => ['warning','warning_dnn','nourishment_pause','suspension','deactivation'].includes(c.tier));
  const countSuspension = validCases.filter(c => ['suspension','deactivation'].includes(c.tier) && !c.is_cluster).length +
    (state.current.cases||[]).filter(c => c.is_cluster && ['suspension','deactivation'].includes(c.tier)).length;
  const countPause = validCases.filter(c => c.tier === 'nourishment_pause' && !c.is_cluster).length +
    (state.current.cases||[]).filter(c => c.is_cluster && c.tier === 'nourishment_pause').length;
  const countWarning = validCases.filter(c => c.tier === 'warning').length;
  const countClusters = (state.current.cases||[]).filter(c => c.is_cluster).length;
  return `
    <div class="summary-bar">
      <div class="summary-card"><div class="summary-num" style="color:var(--wine)">${countSuspension}</div><div class="summary-label">Suspension</div></div>
      <div class="summary-card"><div class="summary-num" style="color:var(--amber-dark)">${countPause}</div><div class="summary-label">Nourishment Pause</div></div>
      <div class="summary-card"><div class="summary-num" style="color:var(--olive)">${countWarning}</div><div class="summary-label">Warning</div></div>
      <div class="summary-card"><div class="summary-num" style="color:var(--text-sec)">${countClusters}</div><div class="summary-label">Clusters</div></div>
    </div>
    <div class="run-info">
      <div class="run-meta">Week of ${state.current.run?.week_of} · Run date: ${runDate()} · Agent v5.2</div>
      <button class="btn btn-secondary" onclick="switchView('load')" style="font-size:12px;padding:4px 10px;">+ Load new run</button>
    </div>
    <div class="filter-bar">
      ${[['all','All'],['cluster','⚠ Cluster'],['suspension','Suspension'],['warning_dnn','Warning DNN'],['nourishment_pause','Nourishment Pause'],['warning','Warning']].map(([f,l])=>`<button class="filter-btn ${state.filter===f?'active':''}" onclick="setFilter('${f}')">${l}</button>`).join('')}
    </div>
    ${(state.current.field_alerts||[]).map(a=>{const crit=a.includes('CRITICAL');return `<div style="padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;font-weight:500;background:${crit?'#FEF2F2':'#FFFBEB'};color:${crit?'#991B1B':'#633806'};border-left:3px solid ${crit?'#991B1B':'#F59E0B'}">${a.replace('⚠ CRITICAL: ','🚨 ').replace('⚠ WARNING: ','⚠️ ')}</div>`;}).join('')}
    ${(state.current.existing_cases||[]).length>0?`<div style="background:#FFF7ED;border:0.5px solid #FED7AA;border-radius:8px;padding:14px 16px;margin-bottom:12px">
      <div style="font-weight:600;color:#C2410C;margin-bottom:8px;font-size:13px">⚠ Hosts with active flags posting this week (${state.current.existing_cases.length})</div>
      ${(state.current.existing_cases||[]).map(c=>`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-top:0.5px solid #FED7AA;font-size:13px">
          <div>
            <a href="${c.sf_url}" target="_blank" style="font-weight:500;color:#C2410C;text-decoration:underline">${c.host_name}</a>
            <span style="margin-left:8px;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;${c.existing_case_type==='suspension'?'background:#FECACA;color:#991B1B':'background:#FAEEDA;color:#633806'}">${c.existing_case_type==='suspension'?'SUSPENDED':'DNN'}</span>
            · ${c.dinner_name} · <strong>${c.campaign_status}</strong>
            <div style="font-size:12px;color:#92400E;margin-top:3px">${c.note}</div>
          </div>
          <span style="color:var(--text-sec);font-size:12px;white-space:nowrap;margin-left:12px">${c.nourishment_received} received</span>
        </div>`).join('')}
    </div>`:''}
    ${(()=>{
      const actionableCases = filtered.filter(c => c.tier !== 'warning');
      const allWarnings = (state.current.cases||[]).filter(c => c.tier === 'warning');
      const highNourWarnings = allWarnings.filter(c => {
        const n = parseFloat(String(c.nourishment_received||'0').replace(/[$,]/g,'')) || 0;
        return n >= 1000;
      });
      const stdWarnings = allWarnings.filter(c => {
        const n = parseFloat(String(c.nourishment_received||'0').replace(/[$,]/g,'')) || 0;
        return n < 1000;
      });
      let html = '';
      if (actionableCases.length === 0 && state.filter === 'all') {
        html += '<div style="font-size:14px;color:var(--text-sec);margin-bottom:16px;">No suspension or DNN cases this week.</div>';
      } else {
        html += actionableCases.map(buildCaseCard).join('');
      }

      // High-nourishment warnings -- needs Abbie review
      if ((state.filter === 'all' || state.filter === 'warning') && highNourWarnings.length > 0) {
        const isExpanded = state.highNourWarningsExpanded;
        html += `<div style="margin-top:16px;border:0.5px solid #FED7AA;border-radius:8px;overflow:hidden">
          <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:#FFFBEB" onclick="state.highNourWarningsExpanded=!state.highNourWarningsExpanded;render()">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:13px;font-weight:600;color:#92400E">⚠ Warnings · High Nourishment</span>
              <span style="font-size:12px;color:#92400E">${highNourWarnings.length} cases · $1,000+ received · review with Abbie</span>
            </div>
            <span style="font-size:14px;color:#92400E;transform:${isExpanded?'rotate(180deg)':'rotate(0)'};transition:transform .2s">▾</span>
          </div>
          ${isExpanded ? `<div style="border-top:0.5px solid #FED7AA">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead><tr style="background:#FFFBEB;font-size:11px;color:#92400E;text-transform:uppercase;letter-spacing:.04em">
                <th style="padding:8px 16px;text-align:left;font-weight:500">Host</th>
                <th style="padding:8px 16px;text-align:left;font-weight:500">Signals</th>
                <th style="padding:8px 8px;text-align:center;font-weight:500">Score</th>
                <th style="padding:8px 16px;text-align:right;font-weight:500">Nourishment</th>
                <th style="padding:8px 16px;text-align:right;font-weight:500">Links</th>
              </tr></thead>
              <tbody>${highNourWarnings.map((c,i)=>`<tr style="border-top:0.5px solid #FED7AA;background:${i%2===0?'#fff':'#FFFBEB'}">
                <td style="padding:10px 16px"><a href="${c.sf_url}" target="_blank" style="color:var(--text);text-decoration:underline;font-weight:500">${c.name}</a></td>
                <td style="padding:10px 16px;color:var(--text-sec)">${(c.signals||[]).filter(s=>s.score_contribution>0).map(s=>s.name).join(', ')}</td>
                <td style="padding:10px 8px;text-align:center;font-weight:500">${c.score}</td>
                <td style="padding:10px 16px;text-align:right;font-weight:600;color:#92400E">${c.nourishment_received||'—'}</td>
                <td style="padding:10px 16px;text-align:right;white-space:nowrap">
                  ${c.sf_url?`<button onclick="copyLink('${c.sf_url}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Contact</button> `:''}
                  ${sfCampaignUrl(c)?`<button onclick="copyLink('${sfCampaignUrl(c)}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Dinner</button>`:''}
                </td>
              </tr>`).join('')}</tbody>
            </table>
          </div>` : ''}
        </div>`;
      }

      // Standard warnings -- auto-sent, no review needed
      if ((state.filter === 'all' || state.filter === 'warning') && stdWarnings.length > 0) {
        const isExpanded = state.warningsExpanded;
        html += `<div style="margin-top:8px;border:0.5px solid var(--border);border-radius:8px;overflow:hidden">
          <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--card)" onclick="state.warningsExpanded=!state.warningsExpanded;render()">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:13px;font-weight:600;color:var(--olive)">Warnings</span>
              <span style="font-size:12px;color:var(--text-sec)">${stdWarnings.length} cases · auto-sent · no review needed</span>
            </div>
            <span style="font-size:14px;color:var(--text-sec);transform:${isExpanded?'rotate(180deg)':'rotate(0)'};transition:transform .2s">▾</span>
          </div>
          ${isExpanded ? `<div style="border-top:0.5px solid var(--border)">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead><tr style="background:#FAFAF8;font-size:11px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.04em">
                <th style="padding:8px 16px;text-align:left;font-weight:500">Host</th>
                <th style="padding:8px 16px;text-align:left;font-weight:500">Signals</th>
                <th style="padding:8px 8px;text-align:center;font-weight:500">Score</th>
                <th style="padding:8px 16px;text-align:right;font-weight:500">Nourishment</th>
                <th style="padding:8px 16px;text-align:right;font-weight:500">Links</th>
              </tr></thead>
              <tbody>${stdWarnings.map((c,i)=>`<tr style="border-top:0.5px solid var(--border);background:${i%2===0?'#fff':'#FAFAF8'}">
                <td style="padding:10px 16px"><a href="${c.sf_url}" target="_blank" style="color:var(--text);text-decoration:underline;font-weight:500">${c.name}</a></td>
                <td style="padding:10px 16px;color:var(--text-sec)">${(c.signals||[]).filter(s=>s.score_contribution>0).map(s=>s.name).join(', ')}</td>
                <td style="padding:10px 8px;text-align:center;font-weight:500">${c.score}</td>
                <td style="padding:10px 16px;text-align:right;color:var(--text-sec)">${c.nourishment_received||'—'}</td>
                <td style="padding:10px 16px;text-align:right;white-space:nowrap">
                  ${c.sf_url?`<button onclick="copyLink('${c.sf_url}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Contact</button> `:''}
                  ${sfCampaignUrl(c)?`<button onclick="copyLink('${sfCampaignUrl(c)}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Dinner</button>`:''}
                </td>
              </tr>`).join('')}</tbody>
            </table>
          </div>` : ''}
        </div>`;
      }
      return html;
    })()}
      let html = '';
      if (actionableCases.length === 0 && state.filter === 'all') {
        html += '<div style="font-size:14px;color:var(--text-sec);margin-bottom:16px;">No suspension or DNN cases this week.</div>';
      } else {
        html += actionableCases.map(buildCaseCard).join('');
      }
      return html;
    })()}
    ${flags.length>0?`<div class="section-divider">Cross-host flags — program team</div>${flags.map(buildFlagCard).join('')}`:''}
    ${priorAction.length>0?`<div class="section-divider">Prior actions — no new consequence</div>${priorAction.map(c=>`<div class="prior-action-note">⚑ <strong>${c.name}</strong> — ${c.collapsed_summary||'Already suspended or DNN. No new action required this week.'}</div>`).join('')}`:''}
    ${buildInsights()}
    ${buildSlack(allActioned)}`;
}

// ── case card ─────────────────────────────────────────────────────────────
function buildCaseCard(c) {
  const a = state.actionState[c.id]||{};
  const actioned = !!a.tier;
  const displayTier = a.tier||c.tier;
  const isOpen = state.openCards.has(c.id);
  const scoredSignals = (c.signals||[]).filter(s=>s.score_contribution>0);
  const signalSummary = scoredSignals.map(s=>s.name).join(' · ');

  // Warning cases: compact single-line row, expand on click for full detail
  if (c.tier === 'warning' && !c.is_cluster) {
    return `<div class="case-card" id="card-${c.id}" style="margin-bottom:4px">
      <div class="case-header ${isOpen?'open':''}" onclick="toggleCard('${c.id}')" style="padding:10px 14px">
        <div class="score-circle" style="background:${scoreBg(c.tier)};color:${scoreColor(c.tier)};width:32px;height:32px;font-size:13px">${c.score}</div>
        <div class="case-meta" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <a class="case-name" href="${c.sf_url}" target="_blank" onclick="event.stopPropagation()" style="font-size:14px;white-space:nowrap">${c.name} ↗</a>
          ${c.sf_url?`<button onclick="copyLink('${c.sf_url}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Contact</button>`:''}
          ${sfCampaignUrl(c)?`<button onclick="copyLink('${sfCampaignUrl(c)}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer">Dinner</button>`:''}
          <span class="badge ${tierClass(displayTier)}" style="font-size:11px">${tierLabel(displayTier, c.score)}</span>
          <span style="font-size:12px;color:var(--text-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${signalSummary}</span>
          ${actioned?'<span class="badge actioned" style="font-size:11px">✓ Reviewed</span>':''}
        </div>
        <span style="font-size:12px;color:var(--text-sec);white-space:nowrap">${c.nourishment_received}</span>
        <span class="chevron ${isOpen?'open':''}">▾</span>
      </div>
      ${isOpen?buildCaseBody(c,a,actioned,displayTier):''}
    </div>`;
  }

  // DNN and Suspension: full card
  return `<div class="case-card" id="card-${c.id}">
    <div class="case-header ${isOpen?'open':''}" onclick="toggleCard('${c.id}')">
      <div class="score-circle" style="background:${scoreBg(c.tier)};color:${scoreColor(c.tier)}">${c.score}</div>
      <div class="case-meta">
        <div class="case-name-row">
          <a class="case-name" href="${c.sf_url}" target="_blank" onclick="event.stopPropagation()">${c.name} ↗</a>
          ${c.sf_url?`<button onclick="copyLink('${c.sf_url}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer" title="Copy Contact link">Contact</button>`:''}
          ${sfCampaignUrl(c)?`<button onclick="copyLink('${sfCampaignUrl(c)}')" style="font-size:11px;padding:2px 6px;border:0.5px solid var(--border);border-radius:4px;background:transparent;color:var(--text-sec);cursor:pointer" title="Copy Campaign link">Dinner</button>`:''}
          <span class="badge ${tierClass(displayTier)}">${c.is_cluster?'⚠ Cluster · ':''}${tierLabel(displayTier, c.score)}</span>
          ${actioned?'<span class="badge actioned">✓ Actioned</span>':''}
        </div>
        <div class="case-stats">
          <span>${c.dinner_name||''}</span>
          ${c.dinner_name?`<span style="color:var(--border)">·</span>`:''}
          <span>${c.nourishment_eligible ? `$${c.nourishment_eligible} eligible` : ''}</span>
          ${c.nourishment_received?`<span style="color:var(--border)">·</span><span>${c.nourishment_received} received</span>`:''}
          ${c.suspended?'<span style="color:var(--border)">·</span><span style="color:var(--wine);font-weight:500">active suspension</span>':''}
          ${c.dnn&&!c.suspended?'<span style="color:var(--border)">·</span><span style="color:var(--amber-dark);font-weight:500">DNN</span>':''}
        </div>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">
          ${scoredSignals.map(s=>`<span style="font-size:11px;padding:2px 7px;border-radius:4px;background:${c.tier==='suspension'?'var(--wine-light)':'#FAEEDA'};color:${c.tier==='suspension'?'var(--wine)':'var(--amber-dark)'}">● ${s.name}${s.observed?' · '+s.observed:''}</span>`).join('')}
        </div>
      </div>
      <span class="chevron ${isOpen?'open':''}">▾</span>
    </div>
    ${isOpen?buildCaseBody(c,a,actioned,displayTier):''}
  </div>`;
}

function buildCaseBody(c, a, actioned, displayTier) {
  const hosts = c.is_cluster&&c.cluster_hosts?.length ? c.cluster_hosts.map(h=>h.name) : [c.name];
  const overrideOpen = state.overrideOpen===c.id;
  const clusterWarn = state.clusterWarning===c.id;

  return `<div class="case-body">
    ${c.is_cluster&&c.cluster_note?`<div class="cluster-banner">🔗 ${md(c.cluster_note)}</div>`:''}
    ${c.is_cluster?`<div style="font-size:12px;color:var(--text-sec);margin:4px 0 8px;padding:0 2px">Score shown is the highest individual score — not a combined total.</div>`:''}
    ${c.is_cluster&&c.cluster_hosts?.length?`
      <div class="section-label">Hosts</div>
      <table class="cluster-table">
        <thead><tr><th>Host</th><th>Email</th><th>Score</th><th>Nourishment</th><th>Address</th><th>Key signals</th></tr></thead>
        <tbody>${c.cluster_hosts.map(h=>`<tr>
          <td><a class="purple-link" href="${h.sf_url}" target="_blank">${h.name}</a></td>
          <td style="font-size:12px;color:var(--text-sec)">${h.email||'—'}</td>
          <td>${h.score}</td><td>${h.nourishment_received}</td>
          <td style="font-size:12px;color:var(--text-sec)">${h.address||'—'}</td>
          <td style="font-size:12px;color:var(--text-sec)">${h.key_signals||''}</td>
        </tr>`).join('')}</tbody>
      </table>`:''}

    <div class="section-label">Summary</div>
    <ul class="bullets">${(c.bullets||[]).map(b=>`<li>${md(b)}</li>`).join('')}</ul>

    ${c.score_breakdown?`
      <div class="collapsible">
        <div class="collapsible-header" onclick="toggleCollapsible(this)">Signals &amp; Score <span class="chevron">▾</span></div>
        <div class="collapsible-body">
          ${(c.signals||[]).filter(s=>s.triggered&&s.score_contribution>0).sort((a,b)=>b.score_contribution-a.score_contribution).map(s=>`
            <div class="breakdown-row"><span style="color:var(--text-sec)">${s.name} <span style="font-size:12px;color:var(--text-ter)">${s.observed||''}</span></span><span class="breakdown-contrib">+${s.score_contribution}</span></div>`).join('')}
          ${(c.signals||[]).filter(s=>!s.triggered).map(s=>`
            <div class="breakdown-row dimmed"><span style="color:var(--text-ter)">${s.name} — ${s.observed||s.threshold||'not triggered'}</span><span style="color:var(--text-ter)">+0</span></div>`).join('')}
          <div class="breakdown-total"><span>Total</span><span style="color:var(--wine)">${c.score}</span></div>
        </div>
      </div>`:''}

    ${['warning_dnn','nourishment_pause','suspension','deactivation'].includes(c.tier) ? buildHostContextPanels(c) : ''}

    ${clusterWarn?`<div class="cluster-warning">⚠ This is a cluster case. Consult Amalia before proceeding.
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button class="btn btn-primary" style="font-size:12px;padding:5px 12px;" onclick="confirmCluster('${c.id}')">Confirmed, proceed</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 12px;" onclick="cancelCluster()">Cancel</button>
      </div></div>`:''}

    ${actioned?buildActionChecklist(displayTier,hosts,runDate(),'ts',a.note):''}

    <div style="margin-top:14px;">
      <div class="section-label">Internal notes</div>
      <textarea class="notes-textarea" placeholder="Add notes -- context, agreements, decisions. Saved with this run and added to Salesforce case on approval." oninput="saveNote('${c.id}',this.value)">${a.note||''}</textarea>
    </div>

    ${overrideOpen?`<div class="override-panel">
      <label>Select action</label>
      <select id="override-tier-${c.id}">
        <option value="">-- select --</option>
        <optgroup label="Override tier">
          <option value="warning">Warning (1-8)</option>
          <option value="nourishment_pause">Nourishment Pause (9-17)</option>
          <option value="suspension">Suspension (18-39)</option>
          <option value="deactivation">Deactivation (40+)</option>
        </optgroup>
        <optgroup label="Close without consequence">
          <option value="dismiss">Dismiss -- no misuse</option>
          <option value="program_team">Refer to program team</option>
        </optgroup>
      </select>
      <label>Reason</label>
      <textarea id="override-reason-${c.id}" placeholder="Explain why..." style="min-height:60px;resize:vertical;"></textarea>
      <button class="btn" style="background:var(--amber-dark);color:#fff;font-size:13px;" onclick="confirmOverride('${c.id}')">Confirm</button>
    </div>`:''}

    <div class="card-footer">
      <div class="footer-left">
        ${c.is_cluster && c.cluster_hosts?.length ? `
          <div style="display:flex;flex-direction:column;gap:6px;width:100%">
            <div style="font-size:11px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Approve per host</div>
            ${c.cluster_hosts.map(h => {
              const hid = `${c.id}__${h.name.replace(/\s+/g,'_')}`;
              const ha = state.actionState[hid];
              const happroved = !!ha?.tier;
              const htier = ha?.tier || h.score >= 18 ? 'suspension' : h.score >= 9 ? 'nourishment_pause' : 'warning';
              return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-size:13px;min-width:120px"><a class="purple-link" href="${h.sf_url}" target="_blank">${h.name}</a></span>
                <span class="badge ${htier}" style="font-size:11px">${TIER_LABELS[h.score >= 18 ? 'suspension' : h.score >= 9 ? 'nourishment_pause' : 'warning']}</span>
                <button class="btn btn-primary" style="font-size:12px;padding:4px 10px" ${happroved?'disabled':''} onclick="approveHost('${c.id}','${h.name}','${h.score >= 18 ? 'suspension' : h.score >= 9 ? 'nourishment_pause' : 'warning'}')">${happroved?'✓ Approved':'Approve'}</button>
                ${!happroved?`<button class="btn btn-secondary" style="font-size:12px;padding:4px 10px" onclick="overrideHost('${c.id}','${h.name}')">Override</button>`:''}
                ${state.hostOverrideOpen===hid?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px">
                  <select id="host-override-tier-${hid}" style="font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px">
                    <option value="warning">Warning</option>
                    <option value="nourishment_pause">Nourishment Pause</option>
                    <option value="suspension">Suspension</option>
                    <option value="deactivation">Deactivation</option>

function buildActionChecklist(tier, hosts, rd, type, note) {
  if (tier==='dismiss') return `<div class="action-box dismiss-box">
    <div class="action-title" style="color:var(--text-sec)">Dismissed -- no misuse</div>
    ${hosts.map(h=>`<div class="action-host">${h}</div>

      ${note?`<div class="action-item pending">○ Add note (pending write access)</div>`:''}`).join('')}
  </div>`;
  if (tier==='program_team') return `<div class="action-box program">
    <div class="action-title" style="color:var(--green)">Referred to program team</div>
    ${hosts.map(h=>`<div class="action-host">${h}</div>
      <div class="action-item pending">○ Create Salesforce coaching case (pending write access)</div>
      <div class="action-item ready">✓ Create Gmail draft to program team (active)</div>
      ${note?`<div class="action-item pending">○ Add note (pending write access)</div>`:''}`).join('')}
  </div>`;

  const TS_RT = '012PO000001F53dYAC';
  const items = [
    {l:`Create Salesforce Case — RecordTypeId: ${TS_RT} · Subject: "Trust and Safety — ${tierLabel(tier, 14)} — ${rd}"`,r:false},
    {l:'Set Flag__c = true on Contact',r:false},
    {l:`Set Flag_Reason__c = "See case from ${rd}"`,r:false},
    {l:'Create Gmail draft with consequence email',r:true},
  ];
  if (note) items.push({l:`Add note: "${note.slice(0,80)}${note.length>80?'...':''}"`,r:false});
  if (['nourishment_pause','suspension','deactivation'].includes(tier)) {
    items.push({l:'Set Do_Not_Nourish__c = true',r:false});
    items.push({l:'Move future dinners to Not Nourishing',r:false});
  }
  if (['suspension','deactivation'].includes(tier)) {
    items.push({l:'Set Suspended_Flag__c = true',r:false});
    items.push({l:'Set Grant Application status = "Suspended"',r:false});
  }
  if (tier==='deactivation') {
    items.push({l:'Alert Amalia',r:true});
    items.push({l:'Create Zendesk ticket for IP/account ban',r:false});
  }
  items.push({l:'Manual: check DNN in backend',r:false});
  if (['suspension','deactivation'].includes(tier)) items.push({l:'Manual: check Banned in backend',r:false});

  return `<div class="action-box ts">
    <div class="action-title" style="color:var(--wine)">Actions queued:</div>
    ${hosts.map(h=>`<div class="action-host">${h}</div>
      ${items.map(i=>`<div class="action-item ${i.r?'ready':'pending'}">${i.r?'✓':'○'} ${i.l}${i.r?' (active)':' (pending write access)'}</div>`).join('')}`).join('')}
  </div>`;
}

const CHAT_SYSTEM = `You are the OneTable Trust and Safety case advisor. You help staff review individual host cases flagged during the weekly T&S review. You know the full signal definitions, scoring rules, consequence framework, and policy.

Key rules:
- Warning: 1-8 | Nourishment Pause: 9-17 | Suspension: 18-39 | Deactivation: 40+
- First instance rule: even at 40+, first consequence is Suspension not Deactivation
- Every signal requires pairing except: Shared device FP host+guest (Signal 1), Hard bounces (Signal 12), Reports from users (Signal 21), Deliberate fraud (Signal 22), Deliberate identity change (Signal 23)
- Sequential PIDs: gap ≤ 2, denominator = ALL guests not just profiled guests
- Device FP signals require minimum 3 guests at dinner
- Tier determined by score only -- never override based on narrative

Answer directly and concisely. You can draft outreach emails, explain signal math, suggest Salesforce checks, or discuss edge cases. Stay grounded in the data provided. Never invent facts.`;

function requestDeepDive(c) {
  const hosts = c.cluster_hosts || [];
  const isCluster = c.is_cluster && hosts.length > 0;
  const ctx = `T&S DEEP DIVE REQUEST
${isCluster ? `Cluster: ${c.name}` : `Host: ${c.name}`}
Tier: ${c.tier} | Score: ${c.score} | Nourishment: ${c.nourishment_received}
${isCluster ? `\nHosts:\n${hosts.map(h => `- ${h.name} | Applied: ${h.applied_date||'unknown'} | ${h.dinners_hosted||'?'} dinners | ${h.nourishment_received} | T&S cases: ${h.prior_ts_cases||'?'}`).join('\n')}` : ''}

SF Contact URLs:
${isCluster ? hosts.map(h => `- ${h.name}: ${h.sf_url}`).join('\n') : `- ${c.name}: ${c.sf_url}`}

Please run ALL of the following:

1. HISTORICAL DATE OVERLAP (clusters only)
   Query all past campaign dates for each host and identify any nights where 2+ cluster members posted dinners on the same date. Flag exact date matches.

2. DESCRIPTION SIMILARITY (sig18)
   For each host, query their last 5 dinner descriptions from Salesforce. Check for:
   - Copy/paste or near-identical descriptions across dinners
   - Degrading quality over time (earlier dinners rich, later ones generic/templated)
   - Template patterns shared across hosts in the cluster

3. GUEST LIST RECYCLING (sig15)
   For each host, query CampaignMember records for their last 5 dinners. Identify any Contact IDs that appear at 2+ of those dinners. Flag: how many unique guests vs repeated guests, and whether the same core group appears repeatedly.

4. PRIVACY/DESCRIPTION MISMATCH (sig19)
   For each dinner this week, compare the Privacy setting to the description tone:
   - Private dinner with open/public-sounding language ("everyone welcome", "come one come all", "open invite")
   - Public dinner with exclusive/closed language ("invite only", "friends only", "private circle")
   Flag mismatches.`;

  navigator.clipboard.writeText(ctx).then(() => {
    alert('Deep dive request copied to clipboard. Paste into the review chat to run the analysis.');
  }).catch(() => {
    prompt('Copy this deep dive request and paste into the review chat:', ctx);
  });
}

function openChat(c) {
  state.activeChat = c;
  state.chatMessages = [{role:'assistant', content:`I'm looking at the **${c.name||c.title}** case${c.score?' (score '+c.score+' → '+tierLabel(c.tier, c.score)+')':''}. What would you like to know?`}];
  state.chatInput = '';
  render();
}

function closeChat() { state.activeChat=null; state.chatMessages=[]; render(); }
function setChat(q) { const el=document.getElementById('chat-input'); if(el){el.value=q; state.chatInput=q;} }

function buildChatPanel() {
  const c = state.activeChat;
  const msgs = state.chatMessages||[];
  return `<div class="chat-panel">
    <div class="chat-header">
      <div><div class="chat-header-name">Discuss: ${c.name||c.title||''}</div>
        <div class="chat-header-sub">Score ${c.score||''} · ${tierLabel(c.tier||'', c.score||0)}</div></div>
      <button class="chat-close" onclick="closeChat()">×</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      ${msgs.map(m=>`<div class="chat-msg ${m.role}"><div class="chat-bubble ${m.role}">${md(m.content)}</div></div>`).join('')}
      ${state.chatLoading?'<div class="chat-msg assistant"><div class="chat-bubble assistant" style="color:var(--text-sec)">Thinking...</div></div>':''}
    </div>
    <div class="chat-quick">
      ${['Why this score?','Draft outreach email','What to check in SF?','Explain the signals'].map(q=>`<button class="chat-quick-btn" onclick="setChat('${q}')">${q}</button>`).join('')}
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" placeholder="Ask anything about this case..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}" value="${state.chatInput||''}">
      <button class="chat-send" onclick="sendChat()" ${state.chatLoading?'disabled':''}>↑</button>
    </div>
  </div>`;
}

async function sendChat() {
  const el = document.getElementById('chat-input');
  const msg = el?.value?.trim();
  if (!msg||state.chatLoading) return;
  const c = state.activeChat;
  const ctx = `Case: ${c.name||c.title} | Tier: ${c.tier||''} | Score: ${c.score||''} | Nourishment: ${c.nourishment_received||''} | Suspended: ${c.suspended} | DNN: ${c.dnn}
Score breakdown: ${c.score_breakdown||''}
Signals triggered: ${(c.signals||[]).filter(s=>s.triggered).map(s=>`${s.name} (${s.observed||''} +${s.score_contribution})`).join('; ')}
Host context: ${JSON.stringify(c.host_context||{})}
Summary: ${(c.bullets||[]).map(b=>b.replace(/\*\*/g,'')).join(' | ')}`;

  state.chatMessages = [...(state.chatMessages||[]), {role:'user', content:msg}];
  state.chatLoading = true;
  state.chatInput = '';
  render();

  try {
    const history = (state.chatMessages||[]).slice(0,-1).map(m=>({role:m.role, content:m.content}));
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000,
        system: CHAT_SYSTEM+'\n\n'+ctx,
        messages:[...history,{role:'user',content:msg}]})
    });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    state.chatMessages = [...state.chatMessages, {role:'assistant', content:text}];
  } catch {
    // Clipboard fallback -- copy case context + question for pasting into Claude.ai
    const clipText = `[T&S case question]\n\n${ctx}\n\nQuestion: ${msg}`;
    try {
      await navigator.clipboard.writeText(clipText);
      state.chatMessages = [...state.chatMessages, {
        role:'assistant',
        content:`_API unavailable from local file. Case context + your question copied to clipboard._\n\nPaste into your Claude.ai chat to continue the conversation there.`
      }];
    } catch {
      state.chatMessages = [...state.chatMessages, {
        role:'assistant',
        content:`_API unavailable from local file. To discuss this case, paste the following into Claude.ai:_\n\n\`\`\`\n${ctx}\n\nQuestion: ${msg}\n\`\`\``
      }];
    }
  }
  state.chatLoading = false;
  render();
}

}

function overrideHost(clusterId, hostName) {

  state.hostOverrideOpen = state.hostOverrideOpen === hid ? null : hid;

}

function confirmHostOverride(clusterId, hostName) {
  const hid = `${clusterId}__${hostName.replace(/\s+/g,'_')}`;
  const t = document.getElementById(`host-override-tier-${hid}`)?.value;
  const r = document.getElementById(`host-override-reason-${hid}`)?.value;

  state.actionState[hid] = { tier: t, reason: r };
  state.hostOverrideOpen = null;
  render();

function approveCase(id, tier, isCluster) {
  if (isCluster && state.clusterWarning!==id) { state.clusterWarning=id; render(); return; }
  state.actionState[id] = {...state.actionState[id], tier};
  state.clusterWarning = null;
  state.overrideOpen = null;
  render();
}

function confirmCluster(id) {
  const tier = (state.current.cases||[]).find(c=>c.id===id)?.tier||'suspension';
  state.actionState[id] = {...state.actionState[id], tier};
  state.clusterWarning = null;
  render();
}
function cancelCluster() { state.clusterWarning=null; render(); }

function confirmOverride(id) {
  const t = document.getElementById(`override-tier-${id}`)?.value;
  const r = document.getElementById(`override-reason-${id}`)?.value;
  if (!t) return;
  state.actionState[id] = {...state.actionState[id], tier:t, reason:r};
  state.overrideOpen = null;
  render();
}

function actionFlag(id, type) { state.actionState[id]={tier:type}; render(); }

function saveNote(id, val) {
  state.actionState[id] = {...state.actionState[id], note:val};
  if (state.current) {
    const idx = state.runs.findIndex(r=>r.id===state.current.id);
    if (idx>=0) { state.runs[idx]._actionState=state.actionState; saveRuns(state.runs); }
  }
}

function sendSlack() {
  const btn=document.getElementById('slack-send-btn');

}

function loadRun(idx) {
  state.current = state.runs[idx];

async function autoLoad() {
  const el = document.getElementById('load-status');
  if (el) el.innerHTML = '<div class="load-status" style="background:var(--khaki-light)">Loading ts_ui_data.json...</div>';
  const data = await tryLoadFromFile();
  if (!data) {
    if (el) el.innerHTML = '<div class="load-status error">Could not load ts_ui_data.json. Make sure the file is in the same folder and Claude Code has run the review.</div>';
    return;
  }
  loadData(data);
}

function loadFromPaste() {
  const el = document.getElementById('paste-input');
  const text = el?.value?.trim();
  if (!text) return;
  try {
    const data = JSON.parse(text);
    loadData(data);
  } catch {
    const statusEl = document.getElementById('load-status');
    if (statusEl) statusEl.innerHTML = '<div class="load-status error">Could not parse JSON. Make sure you pasted the full ts_ui_data block.</div>';
  }
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadData(JSON.parse(ev.target.result)); }
    catch { const el=document.getElementById('load-status'); if(el) el.innerHTML='<div class="load-status error">Could not parse JSON file.</div>'; }
  };
  reader.readAsText(file);
}

function normaliseLoadedCase(c) {
  const tier = c.tier;
  return {
    ...c,
    name: c.name || c.host_name || '',
    tier,
    nourishment_received: c.nourishment_received || '—',
    nourishment_eligible: c.nourishment_eligible_this_dinner || c.nourishment_eligible || '—',
    dinner_name: c.dinner_name || '',
    contact_id: c.contact_id || (c.sf_url||'').match(/Contact\/([^/]+)\/view/)?.[1] || '',
    campaign_id: c.campaign_id || (c.id||'').replace('case-',''),
    host_context: c.host_context || null,
    collapsed_summary: c.collapsed_summary || c.pattern_summary || '',
    signals: (c.signals||[]),
    bullets: (c.bullets||[]),
    future_dinners: c.future_dinners || '0',
  };
}

function loadData(data) {
  // Normalise cases
  if (data.cases) data.cases = data.cases.map(normaliseLoadedCase);
  // Surface run-level fields
  if (data.run) {
    data.week_of = data.week_of || data.run.week_of;
    data.run_date = data.run_date || data.run.run_date;
    data.dinners_reviewed = data.dinners_reviewed || data.run.dinners_reviewed;
    data.summary = data.summary || data.run.summary;
    data.field_alerts = data.field_alerts || data.run.field_alerts || [];
  }
  const run = {...data, id:Date.now(), loadedAt:new Date().toISOString()};
  state.runs = [run,...state.runs].slice(0,24);
  saveRuns(state.runs);
  state.current = run;
  state.actionState = {};
  // Auto-open suspension cases, leave DNN and Warning collapsed
  state.openCards = new Set(
    (data.cases||[]).filter(c=>c.tier==='suspension').map(c=>c.id)
  );
  state.filter = 'all';
  state.warningsExpanded = false;
  state.highNourWarningsExpanded = false;
  state.view = 'review';
  render();
}

// ── boot ───────────────────────────────────────────────────────────────────
render();
setTimeout(async () => { const d=await tryLoadFromFile(); if(d) loadData(d); }, 100);
</script>
